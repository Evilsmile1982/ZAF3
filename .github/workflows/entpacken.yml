name: ZAERO Projekt entpacken

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  entpacken:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v5

      - name: ZIP entpacken
        run: |
          unzip -o "ZAERO-ZAF3-v5-komplett.zip" -d .

      - name: Projektdateien speichern
        run: |
          rm -f .github/workflows/build-apk.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "ZAERO Android Projekt entpackt"
          git push
